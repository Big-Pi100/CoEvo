  <style>
  /* 顶部加载条（CSS 动画，非模拟进度） */
  @keyframes load-pulse {
    0%   { left: -20%; width: 20%; }
    50%  { left: 40%;  width: 40%; }
    100% { left: 100%; width: 20%; }
  }
  #loading-bar { position:fixed; top:0; left:0; right:0; height:3px; z-index:9999; overflow:hidden; }
  #loading-bar-inner {
    position:absolute; top:0; bottom:0;
    background:linear-gradient(90deg,#6C63FF,#4834d4);
    animation: load-pulse 2s ease-in-out infinite;
  }
  </style>
  <div id="loading-bar">
    <div id="loading-bar-inner"></div>
  </div>
  <div id="load-status" style="
    position:fixed;top:10px;left:50%;transform:translateX(-50%);
    z-index:9999;font-family:-apple-system,sans-serif;
    font-size:12px;color:#888;transition:opacity 0.3s;
  ">正在加载...</div>
  <script>
  (function(){
    var bar = document.getElementById('loading-bar');
    var barInner = document.getElementById('loading-bar-inner');
    var status = document.getElementById('load-status');

    function done() {
      barInner.style.animation = 'none';
      barInner.style.width = '100%';
      status.textContent = '加载完成';
      setTimeout(function() {
        bar.style.opacity = '0';
        status.style.opacity = '0';
        setTimeout(function() {
          bar.style.display = 'none';
          status.style.display = 'none';
        }, 500);
      }, 500);
    }

    function checkFlutter() {
      return document.querySelector('canvas')
          || document.querySelector('flt-glass-pane')
          || document.querySelector('flt-scene');
    }

    // MutationObserver: 只要 DOM 有变化就检查 Flutter 元素
    var observer = new MutationObserver(function() {
      if (checkFlutter()) {
        observer.disconnect();
        clearTimeout(failsafe);
        done();
      }
    });
    observer.observe(document.body || document.documentElement, {
      childList: true, subtree: true
    });

    // 兜底: 30s 强制隐藏 + 每 500ms 轮询一次
    var failsafe = setTimeout(function(){
      observer.disconnect();
      bar.style.display = 'none';
      status.style.display = 'none';
    }, 30000);

    var poll = setInterval(function(){
      if (checkFlutter()) {
        clearInterval(poll);
        clearTimeout(failsafe);
        observer.disconnect();
        done();
      }
    }, 500);
  })();
  </script>
