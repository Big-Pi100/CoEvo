name: coevo_app
description: "刻意进化学习 - CoEvo"
publish_to: 'none'
# 🔴 `+N` 是 Android 的 **versionCode**（每次构建必须递增）——
#    2026-09-28 之前它一直是 `+1`，导致「装了没装上新包」无法判断：
#    版本号恒定 → 新旧包在系统「应用信息」里完全一样。
#    ⚠️ **每次要出包验证的改动，都要把 `+N` 加一。**
version: 1.0.0+3

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  web_socket_channel: ^3.0.2
  http: ^1.3.0
  shared_preferences: ^2.5.3
  flutter_tts: ^4.2.2
  path_provider: ^2.1.0
  image_picker: ^1.1.2
  flutter_math_fork: ^0.7.4
  # 🔴 1.0.8 与官方 Flutter 3.41 不兼容 —— `_RenderSelectableAdapter` 缺
  #    `SelectionHandler.contentLength` / `getSelection`（1.0.9 已补，CHANGELOG：Fixed issues with flutter 3.29.0）
  #
  # 🆕 2026-10-02 升到 **1.3.0**（内容管线 S4：正文改 Markdown 渲染）——
  # 为什么升（三条都对着我们报的症状）：
  #   ① **代码块带语法高亮 + 语言标签 + 复制按钮**（近 200 种语言）→ 治「代码块被压平」
  #   ② **内联代码渲染成等宽 chip**（`inlineCodeStyle`）→ 治「`<img>` 等标签裸奔」
  #   ③ 另有 `SliverGptMarkdown`（长文懒渲染）· `plusparse` 新解析器（快 3–9×）
  #
  # 🔴 为什么**钉死版本**（不加 `^`）：可复现构建。
  #    ⚠️ 且 1.3.0 相对 1.0.9 是**大版本内的大改**（源码 2.4k 行 → 17k 行），
  #    `GptMarkdownConfig` 从 96 行涨到 926 行 —— 升级必须显式改这一行，不能靠 `pub upgrade` 漂上来。
  #    📌 若将来要升，先读它的 MIGRATION.md（1.3.0 把 `components`/`inlineComponents`
  #    拆成 `blockComponents`/`inlinePatterns`/`inlineDirectives`）。
  gpt_markdown: 1.3.0
  flutter_secure_storage: ^9.2.4
  # 🆕 2026-10-07 Sign in with Apple（账号登录）
  #
  # 🔴 版本**钉死 8.1.0**，不是偶然：
  #    · 8.2.0 要求 `sdk: ^3.12.0` + `flutter: >=3.44.0`
  #    · 本项目是 Dart **3.11.0** / Flutter **3.41.1**（`dart --version` 实测）
  #    ⇒ 8.2.0 **装不上**（`pub get` 直接解析失败）。8.1.0
  #      （`sdk ^3.11.0` / `flutter >=3.41.0`）是**当前能用的最高版**。
  #    📌 升级本行前先核对本机 Dart/Flutter 版本，否则依赖解析会挂。
  #
  # ⚠️ 它带 2 个传递依赖：`sign_in_with_apple_platform_interface` / `sign_in_with_apple_web`
  #    —— 已一并写入 `pubspec.lock`（本机 `flutter` 命令跑不了 ⇒ lock 只能手工维护，
  #    见 `app/pubspec.lock` 里那三条的 sha256 来源：pub.dev API 的 `archive_sha256`）。
  sign_in_with_apple: 8.1.0
  flutter_web_plugins:
    sdk: flutter
  freezed_annotation: ^2.4.0
  json_annotation: ^4.9.0
  # 🔴 sherpa_onnx 已于 2026-09-26 移除：TTS 全量端侧 flutter_tts，离线神经网络 TTS 路线废弃
  #    （sherpa_tts.dart 已删，实测零引用；详见 docs/design/tts-unified-client-side-2026-09-26.md）
  #    保留 audioplayers —— 后端 TTS（腾讯云）保留，音频仍需端侧播放
  audioplayers: ^6.1.0
  # 🔴 `intl` 已于 2026-09-28 移除 —— **源码 0 处使用**。
  #
  # 唯一使用者是 `screens/card_list_screen.dart`（K12 遗留的旧生词本页，用 `DateFormat`）
  # —— 该文件同日删除后，本依赖**失去全部用途**。
  #
  # 🔑 两条已核实的前提：
  #   ① 项目**未使用** `flutter_localizations`（全库搜 `localizationsDelegates` /
  #      `GlobalMaterialLocalizations` 均 0 命中）→ 移除不影响 Material 本地化
  #   ② 日期/时间格式化现**由各页面自写**（如 `review_screen._dueLabel` 的
  #      「3 天后」相对时间），需求简单 → 不值得为它保留一个依赖
  #
  # ⚠️ 判据：**依赖也是死代码**。删掉一个功能后要连它的依赖一起清，
  #    否则依赖树会只增不减（同「删功能要清语义残留」的既定原则）。
  #
  # 🔴 `record` 已于 2026-10-07 移除（**同一判据的第二次应用**）——
  #    源码 0 处使用：`grep -rn "package:record\|AudioRecorder" app/lib` → 无命中。
  #    它是上一轮删「跟读」功能时**漏掉的依赖残留**。
  #
  #    ⚠️ 它同时**污染了 iOS 构建**：`record_ios` 会把麦克风 API 链接进 App，
  #       而 `Info.plist` 原本没有 `NSMicrophoneUsageDescription` ——
  #       「链接了却不用」，审核会追问为什么申请麦克风权限。
  #    ⇒ 依赖与其 iOS 权限声明**一并移除**（见 `ios/Runner/Info.plist`）。
  #    📌 若将来真做录音：加回依赖 + **同时**补回那条 Info.plist 声明。
  web: ^1.1.1
  qr_flutter: ^4.1.0
  graphic: ^2.7.0
  flutter_twemoji: ^1.1.0
  flutter_svg: ^2.2.0
  # FSRS 间隔重复调度（端侧权威）—— 纯 Dart，仅 fsrs + meta 两个依赖
  # 见 docs/design/fsrs-client-side-migration-plan-2026-09-26.md
  fsrs: ^2.0.1
  # Step 1 清障：替换 web-only 依赖（见 ui-ux-refactor-assessment §1.2 映射表）
  # 用途：分享图片（原 html.Blob + AnchorElement 下载）/ 打开外部链接（原 html.window.open）
  share_plus: ^10.1.4
  url_launcher: ^6.3.2
  # 端侧 SQLite —— 查词（word.db 只读）+ 复习状态（user.db）
  # 见 docs/design/word-query-indexing-audit-2026-09-26.md
  # 服务层只 import `package:sqflite_common/sqlite_api.dart`（纯 Dart 接口）
  # → 可在无 Flutter 环境下用 sqflite_common_ffi 跑真库断言
  sqflite: ^2.4.1
  # 服务层直接 import 的是 `package:sqflite_common/sqlite_api.dart`（纯 Dart 接口），
  # 而 `sqflite_common` 只是 `sqflite` 的传递依赖 → **显式声明**才符合 pub 规范。
  # 理由与下面的 `path` 相同：**隐式依赖会在上游改依赖树时突然断掉**，
  # 且 `depend_on_referenced_packages` 会持续告警（实测 8 处）。
  # ⚠️ 这不是「新引入依赖」—— `.dart_tool/package_config.json` 里本来就有它，
  #    声明后**版本解析结果不变**（lock 里为 2.5.4+6），只是把它写进契约。
  sqflite_common: ^2.5.4
  # 路径拼接（`user.db` / `word.db` 的落盘位置）
  # 本是 Flutter SDK 的传递依赖，这里**显式声明**才符合 pub 规范
  # （隐式依赖会在上游改依赖树时突然断掉，且 `depend_on_referenced_packages` 会告警）
  path: ^1.9.0
  # ── Apple 应用内购买（2026-10-04 · 替代已删除的微信支付）────────────
  #
  # 🔑 为什么用 `flutter.dev` 官方包而不是第三方（如 RevenueCat）：
  #    ① RevenueCat 是境外服务 ⇒ **用户订阅数据出境**，与本项目已核实的
  #       「境外广告平台」问题同族（合规风险）—— 见 `payment-iap-assessment` §5.2
  #    ② 我们的订阅权益是**端侧功能**（生词本 + 朗读）⇒ 不需要服务端托管状态
  #    📌 判据：**「平台允许」≠「法律允许」** —— 技术可行不等于能用。
  #
  # 🔑 版本注意：`in_app_purchase` 的**通用 API 在 iOS/macOS 上默认走 StoreKit 2**，
  #    不需要额外引 `in_app_purchase_storekit`（它的 iOS 实现是 endorsed federated plugin，
  #    会随本包自动带上）。⚠️ 若要退回 StoreKit 1 才需要显式调
  #    `InAppPurchaseStoreKitPlatform.enableStoreKit1()` —— **我们不要那个**。
  #
  # ⚠️ 本机 `flutter pub get` **不可用**（`flutter` 命令建不了子进程）⇒
  #    本依赖的解析结果**只能靠 CI 验证**。若 CI 报版本冲突，改这一行即可。
  in_app_purchase: ^3.3.1

  # ── 电子书导入（2026-10-04）───────────────────────────────────────────
  #
  # 🔑 用途与选型（依据 `docs/design/ebook-import-implementation-2026-10-04.md`）：
  #    · `archive` —— `.epub` 本质是 zip ⇒ 解压。**纯 Dart，无原生依赖**
  #    · `xml`     —— 解析 `META-INF/container.xml` 与 `content.opf`（都是简单 XML）
  #
  # 🔴 **为什么不用现成的 EPUB 阅读器包**（`epub_view` / `cosmos_epub` 等）：
  #    ① 它们是**阅读器 UI 组件**（自带排版/翻页），而我们有自建设计系统，嵌不进来
  #    ② 我们只要**纯文本** —— 不需要保留原书样式/图片
  #    ③ 主流几个包维护评级都是 `Poor`（见 `ebook-import-assessment` §2.1）
  #
  # 🔴 **`xml` 为什么钉 6.x 而不是最新的 7.x**：
  #    `pubspec.lock` 里 `xml` 已是 **6.5.0**（`gpt_markdown` 依赖链的传递依赖）。
  #    升到 7.x 会**连带把 `petitparser` 从 6.0.2 升到 7.x** —— 而 `gpt_markdown`
  #    （正文 Markdown 渲染的**核心**）依赖它。
  #    📌 判据：**不为「解析两个小 XML」去动渲染链的依赖树**。
  #      我们的用法只有 `descendants` / `name.local` / `getAttribute` / `innerText`，
  #      6.x 全都有 ⇒ 没有功能损失。
  #
  # ⚠️ 版本与 `scripts/ebook_verify/pubspec.yaml` **必须一致**（同一份解析代码两边跑）。
  # ⚠️ 本机 `flutter pub get` 不可用 ⇒ 这两个依赖能否解析**只能靠 CI 验证**。
  archive: ^4.3.0
  xml: ^6.5.0
  # 🔑 `crypto` —— **内容指纹**（`sha256(原始文件字节)`），用于跨设备识别「同一本书」。
  #
  # 用途（依据 `docs/design/sync-implementation-assessment-2026-10-04.md` §3.4）：
  #   `book.id` 是端侧 uuid ⇒ 同一本书在两台设备上是两个 id ⇒ 进度对不上。
  #   用内容指纹做跨设备身份，再配一张「待认领」表承接「本地还没导入时」的进度。
  #
  # 🔑 版本 `^3.0.7` —— 它**已在 `pubspec.lock` 里**（`3.0.7`，`dependency: transitive`，
  #    被别的包拉进来的）⇒ 显式声明**不改变版本解析结果**，只是把它写进契约
  #    （与 `uuid` / `sqflite_common` / `path` 的处理**完全同一模式**，也符合 pub 规范：
  #     隐式依赖会在上游改依赖树时突然断掉，且 `depend_on_referenced_packages` 会告警）。
  #
  # ✅ 已核实无版本冲突：pub 缓存里所有依赖 crypto 的包都要求 `^3.0.x`
  #    （`^3.0.0` / `^3.0.2` / `^3.0.3` / `^3.0.6`——**没有一个**要求 `0.x`。
  #      ⚠️ `0.3.4+2` 那种老版本在 pub.dev 上**已不存在**，写了会解析失败）。
  #
  # ⚠️ `scripts/ebook_verify/pubspec.yaml` **必须声明同一约束** ——
  #    `book_importer.dart` / `book_import_plan.dart` 是**两边共用**的同一份代码
  #    （同上方 `xml` 的那条理由）。
  crypto: ^3.0.7

  # ── 书库：id 生成 + 选文件（2026-10-04）────────────────────────────────
  #
  # 🔑 `uuid` —— 书 id / 章节 id（**端侧生成**，不与后端关联）。
  #    **零下载**：它已在 `pubspec.lock` 里（但标着 `transitive`，被别的包拉进来的）。
  #    仍然要**显式声明** —— 隐式依赖会在上游改依赖树时突然断掉，
  #    且 `depend_on_referenced_packages` 会告警（本项目已记这条）。
  #
  # 🔑 `file_selector` —— 书库页右上角「导入」选文件（白哥 2026-10-04 定的位置）。
  #    选它而不是 `file_picker`：`file_selector` 是 **flutter.dev 官方包**
  #    （`file_picker` 是第三方），与本项目「优先官方包」的既有取向一致。
  #    ✅ 它的传输依赖 `file_selector_platform_interface` / `cross_file` **已在 lock 里**
  #       （被 `image_picker` 拉的）⇒ 只需新下载 `file_selector` 与其 iOS 实现。
  #
  # ⚠️ 本机 `flutter pub get` 不可用 ⇒ 这两个依赖能否解析**只能靠 CI 验证**。
  uuid: ^3.0.7
  file_selector: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  fl_chart: ^0.70.0
  # 让「查询层」能在纯 Dart 下用真库验证（Ffi 实现 = 桌面端 sqlite3）
  sqflite_common_ffi: ^2.3.4
  dart_code_metrics: ^5.7.1
  build_runner: ^2.4.0
  freezed: ^2.5.0
  json_serializable: ^6.8.0

# 🔴 flutter_math_fork 的**本地改写副本**（`packages/flutter_math_fork/`）已于 2026-09-27 移除，此处的 override 一并删除。
#    它当初是为**鸿蒙定制版 Flutter**（3.27.5-ohos）降级适配的 —— 删掉了 `RenderObjectWithLayoutCallbackMixin`
#    （`runLayoutCallback()` 改成旧的 `rebuildIfNecessary()`）+ 补了 4 处 `case TargetPlatform.ohos`。
#    官方 Flutter 3.41 没有 `ohos` 平台、且这些 API 已变 → 必然编译失败。
#    → 现在回落到 **pub 官方 0.7.4**（`flutter_math_fork` 是 `gpt_markdown` 的依赖，不在我们的代码里直接用）。
#    依据：docs/review/flutter-run-blocker-2026-09-27.md
dependency_overrides:
  http: ^1.3.0

flutter:
  uses-material-design: true

  # 🔴 assets 必须显式声明 —— 未声明的文件**不会被打包**，
  # 且编译不报错、只在运行时炸（2026-09-26 实测踩到：
  # `assets/sql/user_db_schema.sql` 曾因此不会进包）。
  #
  # ⚠️ `assets/word.db` 是**逐文件**声明（不是目录）—— 它 31.4 MB，
  #    与 `assets/fonts/` 同属「交付物」，进 git 由 `.gitignore` 放行。
  #    🔴 声明它之前，它**从未落盘**（3.4a 实测：`find app/assets -name '*.db'` = 0）
  assets:
    - assets/sql/
    - assets/word.db
    # 🆕 词库版本号（2026-10-01）—— 让端侧能判出「大小相同但内容不同」的词库更新。
    #    🔴 **必须单独声明**：上面那行是**单个文件**（不是目录），不会连带打包同目录其它文件。
    #    漏声明的后果**不报错**：`word_db_provider` 对该资产做了容错（缺失即退回比大小）
    #    → 表现为「静默退化成旧行为」，比崩溃更难发现。
    #    由 `scripts/gen_word_db_version.py` 生成，`scripts/sync_word_db_asset.py` 保证源与副本一致。
    - assets/word_db.version
    # 🔴 字体的**许可文本必须随包分发**（OFL 条件 2：每份副本都要含版权声明与许可）
    #    ⚠️ 只放进 `assets/fonts/` **不够** —— 未在此声明的文件**不会被打包**
    #    （本项目已踩过：`assets/sql/user_db_schema.sql` 曾因此不进包，编译不报错、只在运行时炸）
    - assets/fonts/NotoSansSC-OFL.txt

  fonts:
    # ── 中文 UI（2026-09-27 由阿里普惠体更换）────────────────────
    #
    # ## 为什么换
    # 阿里普惠体条款**禁止子集化**（官方法律声明禁止事项 ②：「对阿里巴巴字体进行
    # 修改、仿制、**转换**……**拆分**……」）→ 3 字重 **24.16 MB 永远减不掉**。
    # **Noto Sans SC** 是 **OFL 1.1**，明确允许 subset / modify / 商用。
    #
    # ## 子集化结果
    # 字符集 = **4,014 码位**（ASCII 95 + 中英标点 + **3,873 汉字**，
    # 从 `word.db` ∪ `app/lib/**.dart` 真实提取）→ **每字重 ≈1.24 MB**
    # → 4 字重 **4.83 MB**（原 24.16 MB）→ **省 19.33 MB**
    #
    # ## 🔑 为什么是 4 个字重（原先是 3 个）
    # 实测代码里 `FontWeight.w600` 用了 **69 处**（用得最多），
    # 而阿里普惠体**只声明了 400/500/700** → 那 69 处一直是 Flutter「**就近取**」。
    # → 本次**补齐真 600**（`SemiBold`），这 69 处的观感才准确。
    #
    # ## 源码与构建
    # · 源文件：`scripts/fetch_fonts.py --only noto-sc`（jsdelivr，含 sha256 校验）
    # · 子集：`scripts/build_fonts.py --candidate noto-sc --ttf`
    # · 评估报告：`docs/review/cjk-font-switch-evaluation-2026-09-27.md`
    #
    # ## ⚠️ 子集化后必须维护的一条断言
    # 字体只含 **4,014 码位**。将来 `word.db` 加词可能引入**新汉字** →
    # **缺字 → 回退系统字体**，且**没有任何报错**（本项目已知教训「有 fallback ≠ 视觉一致」）。
    # → `scripts/tokens_verify` 有一条断言「**`word.db` 全部汉字 ⊆ 字体 cmap**」，
    #   词库一升级它就会红，届时重跑 `build_fonts.py` 重新子集即可。
    #
    # ## ⚠️ OFL 合规（条件 2/3）
    # · 许可文本随包分发 → 见上方 `assets:` 的 `NotoSansSC-OFL.txt`
    # · **Modified Version 不得用 Reserved Font Name** —— 本字体的保留名是
    #   **`Source`**（查官方 OFL.txt 原文），`NotoSansSC` **不是**保留名 → 合规。
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansSC-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansSC-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansSC-Bold.ttf
          weight: 700

    # ── 英文阅读正文（design-system-spec §4.1 · A′ 方案）──
    # 🔴 缺 18 个 IPA 码位 → 音标**必须**由 CharisSIL 承担（见下方注释）
    # 子集来源：scripts/build_fonts.py --candidate literata --ttf
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata-Regular.ttf
          weight: 400
        - asset: assets/fonts/Literata-Bold.ttf
          weight: 700
        # 🔑 独立 Italic —— 不声明则 Flutter 只能合成斜体（词库有 39 张卡的书名标记 `*Faust*`）
        - asset: assets/fonts/Literata-Italic.ttf
          weight: 400
          style: italic

    # ── IPA 音标（design-system-spec §4.1）──
    # 🔴 **只能用在「音标元素」上**（`CoFonts.ipaSerif`）：
    #    若当作整段文字的 fallback 链，会让 93.9% 的音标「一条音标两种字体」
    #    —— 实测 10,823/11,523，见 spec §4.1.1
    - family: CharisSIL
      fonts:
        - asset: assets/fonts/CharisSIL-Regular.ttf
          weight: 400
        - asset: assets/fonts/CharisSIL-Bold.ttf
          weight: 700
