name: coevo_app
description: "刻意进化学习 - CoEvo"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  web_socket_channel: ^3.0.2
  http: ^1.3.0
  shared_preferences: ^2.5.3
  flutter_tts: ^4.2.2
  path_provider: ^2.1.0
  image_picker: ^1.1.2
  flutter_math_fork: ^0.7.4
  gpt_markdown: 1.0.8
  flutter_secure_storage: ^9.2.4
  flutter_web_plugins:
    sdk: flutter
  freezed_annotation: ^2.4.0
  json_annotation: ^4.9.0
  sherpa_onnx: ^1.13.2
  audioplayers: ^6.1.0
  intl: ^0.19.0
  record: ^6.2.1
  web: ^1.1.1
  qr_flutter: ^4.1.0
  graphic: ^2.7.0
  flutter_twemoji: ^1.1.0
  flutter_svg: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  fl_chart: ^0.70.0
  dart_code_metrics: ^5.7.1
  build_runner: ^2.4.0
  freezed: ^2.5.0
  json_serializable: ^6.8.0

dependency_overrides:
  http: ^1.3.0
  flutter_math_fork:
    path: packages/flutter_math_fork

flutter:
  uses-material-design: true

  fonts:
    - family: AlibabaPuHuiTi
      fonts:
        - asset: assets/fonts/AlibabaPuHuiTi-3-35-Thin.ttf
          weight: 100
        - asset: assets/fonts/AlibabaPuHuiTi-3-45-Light.ttf
          weight: 300
        - asset: assets/fonts/AlibabaPuHuiTi-3-55-Regular.ttf
          weight: 400
        - asset: assets/fonts/AlibabaPuHuiTi-3-65-Medium.ttf
          weight: 500
        - asset: assets/fonts/AlibabaPuHuiTi-3-75-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/AlibabaPuHuiTi-3-85-Bold.ttf
          weight: 700
        - asset: assets/fonts/AlibabaPuHuiTi-3-95-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/AlibabaPuHuiTi-3-105-Heavy.ttf
          weight: 900
