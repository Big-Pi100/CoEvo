name: coevo_app
description: "刻意进化学习 - CoEvo"
publish_to: 'none'
# 🔴 `+N` 是 Android 的 **versionCode**（每次构建必须递增）——
#    2026-09-28 之前它一直是 `+1`，导致「装了没装上新包」无法判断：
#    版本号恒定 → 新旧包在系统「应用信息」里完全一样。
#    ⚠️ **每次要出包验证的改动，都要把 `+N` 加一。**
version: 1.0.0+2

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  web_socket_channel: ^3.0.2
  http: ^1.3.0
  shared_preferences: ^2.5.3
  flutter_tts: ^4.2.2
  path_provider: ^2.1.0
  image_picker: ^1.1.2
  flutter_math_fork: ^0.7.4
  # 🔴 1.0.8 与官方 Flutter 3.41 不兼容 —— `_RenderSelectableAdapter` 缺
  #    `SelectionHandler.contentLength` / `getSelection`（1.0.9 已补，CHANGELOG：Fixed issues with flutter 3.29.0）
  gpt_markdown: 1.0.9
  flutter_secure_storage: ^9.2.4
  flutter_web_plugins:
    sdk: flutter
  freezed_annotation: ^2.4.0
  json_annotation: ^4.9.0
  # 🔴 sherpa_onnx 已于 2026-09-26 移除：TTS 全量端侧 flutter_tts，离线神经网络 TTS 路线废弃
  #    （sherpa_tts.dart 已删，实测零引用；详见 docs/design/tts-unified-client-side-2026-09-26.md）
  #    保留 audioplayers —— 后端 TTS（腾讯云）保留，音频仍需端侧播放
  audioplayers: ^6.1.0
  # 🔴 `intl` 已于 2026-09-28 移除 —— **源码 0 处使用**。
  #
  # 唯一使用者是 `screens/card_list_screen.dart`（K12 遗留的旧生词本页，用 `DateFormat`）
  # —— 该文件同日删除后，本依赖**失去全部用途**。
  #
  # 🔑 两条已核实的前提：
  #   ① 项目**未使用** `flutter_localizations`（全库搜 `localizationsDelegates` /
  #      `GlobalMaterialLocalizations` 均 0 命中）→ 移除不影响 Material 本地化
  #   ② 日期/时间格式化现**由各页面自写**（如 `review_screen._dueLabel` 的
  #      「3 天后」相对时间），需求简单 → 不值得为它保留一个依赖
  #
  # ⚠️ 判据：**依赖也是死代码**。删掉一个功能后要连它的依赖一起清，
  #    否则依赖树会只增不减（同「删功能要清语义残留」的既定原则）。
  record: ^6.2.1
  web: ^1.1.1
  qr_flutter: ^4.1.0
  graphic: ^2.7.0
  flutter_twemoji: ^1.1.0
  flutter_svg: ^2.2.0
  # FSRS 间隔重复调度（端侧权威）—— 纯 Dart，仅 fsrs + meta 两个依赖
  # 见 docs/design/fsrs-client-side-migration-plan-2026-09-26.md
  fsrs: ^2.0.1
  # Step 1 清障：替换 web-only 依赖（见 ui-ux-refactor-assessment §1.2 映射表）
  # 用途：分享图片（原 html.Blob + AnchorElement 下载）/ 打开外部链接（原 html.window.open）
  share_plus: ^10.1.4
  url_launcher: ^6.3.2
  # 端侧 SQLite —— 查词（word.db 只读）+ 复习状态（user.db）
  # 见 docs/design/word-query-indexing-audit-2026-09-26.md
  # 服务层只 import `package:sqflite_common/sqlite_api.dart`（纯 Dart 接口）
  # → 可在无 Flutter 环境下用 sqflite_common_ffi 跑真库断言
  sqflite: ^2.4.1
  # 服务层直接 import 的是 `package:sqflite_common/sqlite_api.dart`（纯 Dart 接口），
  # 而 `sqflite_common` 只是 `sqflite` 的传递依赖 → **显式声明**才符合 pub 规范。
  # 理由与下面的 `path` 相同：**隐式依赖会在上游改依赖树时突然断掉**，
  # 且 `depend_on_referenced_packages` 会持续告警（实测 8 处）。
  # ⚠️ 这不是「新引入依赖」—— `.dart_tool/package_config.json` 里本来就有它，
  #    声明后**版本解析结果不变**（lock 里为 2.5.4+6），只是把它写进契约。
  sqflite_common: ^2.5.4
  # 路径拼接（`user.db` / `word.db` 的落盘位置）
  # 本是 Flutter SDK 的传递依赖，这里**显式声明**才符合 pub 规范
  # （隐式依赖会在上游改依赖树时突然断掉，且 `depend_on_referenced_packages` 会告警）
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  fl_chart: ^0.70.0
  # 让「查询层」能在纯 Dart 下用真库验证（Ffi 实现 = 桌面端 sqlite3）
  sqflite_common_ffi: ^2.3.4
  dart_code_metrics: ^5.7.1
  build_runner: ^2.4.0
  freezed: ^2.5.0
  json_serializable: ^6.8.0

# 🔴 flutter_math_fork 的**本地改写副本**（`packages/flutter_math_fork/`）已于 2026-09-27 移除，此处的 override 一并删除。
#    它当初是为**鸿蒙定制版 Flutter**（3.27.5-ohos）降级适配的 —— 删掉了 `RenderObjectWithLayoutCallbackMixin`
#    （`runLayoutCallback()` 改成旧的 `rebuildIfNecessary()`）+ 补了 4 处 `case TargetPlatform.ohos`。
#    官方 Flutter 3.41 没有 `ohos` 平台、且这些 API 已变 → 必然编译失败。
#    → 现在回落到 **pub 官方 0.7.4**（`flutter_math_fork` 是 `gpt_markdown` 的依赖，不在我们的代码里直接用）。
#    依据：docs/review/flutter-run-blocker-2026-09-27.md
dependency_overrides:
  http: ^1.3.0

flutter:
  uses-material-design: true

  # 🔴 assets 必须显式声明 —— 未声明的文件**不会被打包**，
  # 且编译不报错、只在运行时炸（2026-09-26 实测踩到：
  # `assets/sql/user_db_schema.sql` 曾因此不会进包）。
  #
  # ⚠️ `assets/word.db` 是**逐文件**声明（不是目录）—— 它 31.4 MB，
  #    与 `assets/fonts/` 同属「交付物」，进 git 由 `.gitignore` 放行。
  #    🔴 声明它之前，它**从未落盘**（3.4a 实测：`find app/assets -name '*.db'` = 0）
  assets:
    - assets/sql/
    - assets/word.db
    # 🔴 字体的**许可文本必须随包分发**（OFL 条件 2：每份副本都要含版权声明与许可）
    #    ⚠️ 只放进 `assets/fonts/` **不够** —— 未在此声明的文件**不会被打包**
    #    （本项目已踩过：`assets/sql/user_db_schema.sql` 曾因此不进包，编译不报错、只在运行时炸）
    - assets/fonts/NotoSansSC-OFL.txt

  fonts:
    # ── 中文 UI（2026-09-27 由阿里普惠体更换）────────────────────
    #
    # ## 为什么换
    # 阿里普惠体条款**禁止子集化**（官方法律声明禁止事项 ②：「对阿里巴巴字体进行
    # 修改、仿制、**转换**……**拆分**……」）→ 3 字重 **24.16 MB 永远减不掉**。
    # **Noto Sans SC** 是 **OFL 1.1**，明确允许 subset / modify / 商用。
    #
    # ## 子集化结果
    # 字符集 = **4,014 码位**（ASCII 95 + 中英标点 + **3,873 汉字**，
    # 从 `word.db` ∪ `app/lib/**.dart` 真实提取）→ **每字重 ≈1.24 MB**
    # → 4 字重 **4.83 MB**（原 24.16 MB）→ **省 19.33 MB**
    #
    # ## 🔑 为什么是 4 个字重（原先是 3 个）
    # 实测代码里 `FontWeight.w600` 用了 **69 处**（用得最多），
    # 而阿里普惠体**只声明了 400/500/700** → 那 69 处一直是 Flutter「**就近取**」。
    # → 本次**补齐真 600**（`SemiBold`），这 69 处的观感才准确。
    #
    # ## 源码与构建
    # · 源文件：`scripts/fetch_fonts.py --only noto-sc`（jsdelivr，含 sha256 校验）
    # · 子集：`scripts/build_fonts.py --candidate noto-sc --ttf`
    # · 评估报告：`docs/review/cjk-font-switch-evaluation-2026-09-27.md`
    #
    # ## ⚠️ 子集化后必须维护的一条断言
    # 字体只含 **4,014 码位**。将来 `word.db` 加词可能引入**新汉字** →
    # **缺字 → 回退系统字体**，且**没有任何报错**（本项目已知教训「有 fallback ≠ 视觉一致」）。
    # → `scripts/tokens_verify` 有一条断言「**`word.db` 全部汉字 ⊆ 字体 cmap**」，
    #   词库一升级它就会红，届时重跑 `build_fonts.py` 重新子集即可。
    #
    # ## ⚠️ OFL 合规（条件 2/3）
    # · 许可文本随包分发 → 见上方 `assets:` 的 `NotoSansSC-OFL.txt`
    # · **Modified Version 不得用 Reserved Font Name** —— 本字体的保留名是
    #   **`Source`**（查官方 OFL.txt 原文），`NotoSansSC` **不是**保留名 → 合规。
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansSC-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansSC-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansSC-Bold.ttf
          weight: 700

    # ── 英文阅读正文（design-system-spec §4.1 · A′ 方案）──
    # 🔴 缺 18 个 IPA 码位 → 音标**必须**由 CharisSIL 承担（见下方注释）
    # 子集来源：scripts/build_fonts.py --candidate literata --ttf
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata-Regular.ttf
          weight: 400
        - asset: assets/fonts/Literata-Bold.ttf
          weight: 700
        # 🔑 独立 Italic —— 不声明则 Flutter 只能合成斜体（词库有 39 张卡的书名标记 `*Faust*`）
        - asset: assets/fonts/Literata-Italic.ttf
          weight: 400
          style: italic

    # ── IPA 音标（design-system-spec §4.1）──
    # 🔴 **只能用在「音标元素」上**（`CoFonts.ipaSerif`）：
    #    若当作整段文字的 fallback 链，会让 93.9% 的音标「一条音标两种字体」
    #    —— 实测 10,823/11,523，见 spec §4.1.1
    - family: CharisSIL
      fonts:
        - asset: assets/fonts/CharisSIL-Regular.ttf
          weight: 400
        - asset: assets/fonts/CharisSIL-Bold.ttf
          weight: 700
