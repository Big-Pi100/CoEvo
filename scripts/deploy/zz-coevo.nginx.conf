# CoEvo 后端 API —— nginx 反代 + TLS
# 域名: api.keyievolution.fun（已备案 粤ICP备2026061557号-1）
# 后端: 本机 coevo.service（Rust/axum，监听 127.0.0.1:8300）
# TLS : certbot certonly --webroot -w /var/www/certbot -d api.keyievolution.fun
# 部署: 本文件 → /etc/nginx/sites-available/zz-coevo · 软链到 sites-enabled
#
# ─────────────────────────────────────────────────────────────
# 🔴🔴 文件名为什么是 `zz-coevo`（不是 `coevo`）—— 别改
# ─────────────────────────────────────────────────────────────
# 本机 nginx **没有 `default_server`**（`sites-available/default` 里的那两行
# 因该文件**未启用**而不生效）⇒ 默认 server = `sites-enabled/` 里
# **按字典序第一个** 的站点，而 nginx.conf 是 `include /etc/nginx/sites-enabled/*`。
#
# 本机唯一已启用的站点是 `vibedollar-pay`（vibedollar 生产支付网关，**不属本项目**）。
# → 若把本文件命名为 `coevo`（`c` < `v`），它**排在前面** → **抢走默认 server**
#   → 「未匹配 Host」的请求行为被改变（含 **IP 直连 80**）⇒ 影响邻居站点。
# 🔑 `zz-` 前缀保证字典序在 `vibedollar-pay` 之后 ⇒ 默认 server **不变**。
#
# ⚠️ 同理：**本文件只负责 `api.keyievolution.fun`** ——
#    `pay` / `pi` / `mailproxy` 一律不碰（共享机器，只加不改）。

# ── HTTP：仅用于 certbot 验证 + 跳 HTTPS ──
server {
    listen 80;
    listen [::]:80;
    server_name api.keyievolution.fun;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS：反代 coevo.service（127.0.0.1:8300）──
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.keyievolution.fun;

    ssl_certificate     /etc/letsencrypt/live/api.keyievolution.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.keyievolution.fun/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # 🔴 管理端点**不对外**（2026-10-02）
    #
    # 后端沿用了 vibedollar 的商业代码，路由里带一整组 `/api/admin/*`：
    #   · `GET  /api/admin/users/export`        ← **导出用户数据**
    #   · `DELETE /api/admin/users/{id}/hard-delete` ← **硬删除用户**
    #   · `GET  /api/admin/dashboard` / `audit-log` / `users` …
    #
    # 🔑 **CoEvo 的 App 侧对这些端点零调用**（2026-10-02 穷尽 grep：
    #    App 用的是 feed / generate-card / auth / user / notifications /
    #    referral / campaign / pay / public-qrcode —— **不含 admin**）。
    #    而 `/api/admin/login` 暴露在公网还多一个「可被暴力破解」的面。
    # ⇒ 「最小暴露面」：明确 404，而不是指望后端鉴权。
    #
    # ⚠️ **需要 admin 后台时**：删掉下面这一行即可（其余不动）。
    location /api/admin/ {
        return 404;
    }

    # 其余全量反代 —— 后端自己管路由（未知路径由 axum 返 404）
    location / {
        proxy_pass http://127.0.0.1:8300;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 🔴 LLM 制卡是**长请求**：服务端 in-flight 等待 8s，但**首次生成**
        #    要等 DeepSeek 返回（可能 30–60s）。
        #    App 侧 `GenerateCardClient` 用的是 `longTimeout`（60s）——
        #    nginx 若比它短，用户会看到「网络错误」而不是「正在生成」
        #    （把**可等待的状态**伪装成故障）。→ 留余量给 90s。
        proxy_connect_timeout 10s;
        proxy_send_timeout    90s;
        proxy_read_timeout    90s;

        # 请求体很小（一个单词 / 登录表单）；头像上传略大 → 2m 足够
        client_max_body_size 2m;

        # API 不缓存
        proxy_buffering off;
    }
}
