name: query_verify
description: CoEvo 端侧查询层验收 —— 查词 / 词形还原 / 卡片段 / 聚合页入口 / 复习列表
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  sqflite_common_ffi: ^2.3.4
  # 🔴 2026-09-28 加：`ReviewListItem.toReviewState()` 引入了 `fsrs_service`
  #    → 本子项目需能解析它（fsrs_service 内部用 `package:fsrs` 的 `Card`）。
  #
  # 为什么不把转换挪出数据层以避开这个依赖：
  #   `toReviewState()` 是「DB 行 → FSRS 状态」的**字段映射**，属数据层职责；
  #   挪到 UI 层只是把依赖藏起来，并让页面去关心 `step`/`stability` 这些内部单位。
  #   🔑 依赖**如实反映**了数据层现在确实包含这层映射 —— 比隐藏它更诚实。
  #
  # ⚠️ 版本必须与 `app/pubspec.yaml` 一致（同 `fsrs_verify`）——
  #    否则「验收用的行为」与「App 里的行为」可能不是同一个包。
  fsrs: ^2.0.1
  # 🆕 2026-10-10 加：`user_word_repository`（`lookup_event`）现在会生成 uuid
  #    —— 查词记录纳入跨设备同步后，它需要**跨设备身份**（自增 id 在两台设备上必撞）。
  #
  # 🔑 为什么放在 service 层而不是 UI 层：uuid 是**纯 Dart**（无 Flutter 依赖），
  #    所以放在仓储里**不破坏**「service 层可离线断言」这条约束。
  #    ⚠️ 但它是一个**新依赖** ⇒ 验收子项目必须显式声明（否则 `Couldn't resolve`）。
  #    版本与 `app/pubspec.yaml` 一致（同上面 `fsrs` 那条判据：
  #    **验收用的行为必须与 App 里是同一个包**）。
  uuid: ^3.0.7
