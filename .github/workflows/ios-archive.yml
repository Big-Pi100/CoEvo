# iOS 归档 + 导出 IPA + 上传 App Store Connect（TestFlight）
#
# 📄 依据：`docs/operations/ios-appstore-ci-reference.md` §3.2（参考实现）
#    ⚠️ 本文件相对那份参考实现有 **4 处修正**，每一处都在下面注明了理由。
#    启用前提见下方「🔴 前置」段。
#
# ──────────────────────────────────────────────────────────────────────────
# 🔴 前置（不做完，这个 workflow 一定失败）
# ──────────────────────────────────────────────────────────────────────────
#
# ① **Apple Developer 账号办好**（Phase 0）⇒ 拿到 **Team ID**（10 位）
# ② ASC → Users and Access → Integrations → **App Store Connect API**
#    ⇒ 生成 Key（`.p8` + Key ID + Issuer ID）
#
#    🔴🔴 **角色必须选 `Admin`**（2026-10-07 实测踩到）——
#       `xcodebuild -exportArchive` 的 **cloud signing 只接受 Admin 角色的 Key**。
#       Developer / App Manager 角色：**认证能通过、上传也能用**，
#       但会在**签名进行到一半**时失败，且只报一句语焉不详的
#         error: exportArchive Cloud signing permission error
#       （完整信息：`You haven't been given access to cloud-managed distribution
#         certificates. Please contact your team's Account Holder or an Admin…`）
#       ⚠️ 角色**创建时固定、之后不可改** ⇒ 只能**新建**一个 Key 并替换 secrets。
#       🔑 现象特征（很有辨识度）：**`Archive` 成功、只有 `Export IPA` 失败** ——
#          archive 用 Development 证书（cloud signing 够用），
#          export 需要 Distribution 证书（cloud signing 被拒）。
#       📌 依据：developer.apple.com/forums/tags/wwdc21-10204（多个实测帖一致）
#       ⚠️ 副作用：archive 每次都会创建一个 "Created via API" 的 Development 证书，
#          而账号里 Development 证书有**数量上限** ⇒ 需要定期去后台清理孤儿证书。
# ③ 在 GitHub 仓库配 **4 个 Secrets**（Settings → Secrets and variables → Actions）：
#
#      ASC_KEY_ID       Key ID（如 `2X9R4HXF34`）
#      ASC_ISSUER_ID    Issuer ID（UUID 形式）
#      ASC_KEY_P8       **.p8 文件的完整文本内容**（含 BEGIN/END 行）
#      APPLE_TEAM_ID    Team ID（10 位）
#
# ④ ASC 里已创建 App 记录，Bundle ID = `com.coevo.coevoApp`
#
# 📌 缺任一项都会在 runner 上报错（**不是静默失败** —— 见下方的显式校验步骤）。
#
# ──────────────────────────────────────────────────────────────────────────
# 🔴 为什么只有 workflow_dispatch（不许自动触发）
# ──────────────────────────────────────────────────────────────────────────
#
# GitHub 对**私有仓库**的 macOS runner 按 **10 倍**计费
# （2,000 分钟/月 → 实际仅 200 macOS 分钟）。
# 📌 判据：**贵且不可回退的管道，一律人工触发**。

name: iOS Archive & Upload

on:
  workflow_dispatch:
    inputs:
      upload:
        description: '上传到 App Store Connect（TestFlight）。不勾则只产出 IPA 作为 artifact'
        type: boolean
        default: false
      method:
        description: '导出方式（app-store = 上架/TestFlight · ad-hoc / development = 装指定 UDID 的真机验证）'
        type: choice
        options:
          - app-store
          - ad-hoc
          - development
        default: app-store

jobs:
  archive:
    name: Archive & Export IPA
    runs-on: macos-latest
    defaults:
      run:
        # 🔴 工作目录是 `app`（不是仓库根）—— 与 `ci.yml` 的 `ios-build` 一致
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      # ── 🔴 前置校验（先失败，别等到 10 分钟后才报缺 secret）──────────────
      #
      # 📌 为什么单独一步做：macOS runner 按分钟计费，且这些缺失**在构建中期**才暴露。
      #    在这里 5 秒内报出来，省下一整轮 macOS 分钟。
      - name: 校验 Secrets 是否齐全
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "$ASC_KEY_ID" ]    || missing="$missing ASC_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$ASC_KEY_P8" ]    || missing="$missing ASC_KEY_P8"
          [ -n "$APPLE_TEAM_ID" ] || missing="$missing APPLE_TEAM_ID"
          if [ -n "$missing" ]; then
            echo "🔴 缺少 Secrets：$missing"
            echo "   配置位置：仓库 Settings → Secrets and variables → Actions"
            echo "   说明见 .github/workflows/ios-archive.yml 顶部「🔴 前置」"
            exit 1
          fi
          # p8 内容格式粗校验 —— 最常见的错误是「只贴了 base64 主体，丢了 BEGIN/END 行」
          case "$ASC_KEY_P8" in
            *"BEGIN PRIVATE KEY"*) ;;
            *) echo "🔴 ASC_KEY_P8 不含 'BEGIN PRIVATE KEY' —— 需要 .p8 文件的**完整内容**"; exit 1 ;;
          esac
          echo "✅ 4 个 Secrets 齐全（Team ID=${#APPLE_TEAM_ID} 位）"

      - name: Setup Flutter
        # 🔴 钉 `v2.23.0` —— 与 `ci.yml` 的两个 job **同一个号**。
        #    理由（一次真实事故）：浮动 `@v2` 会被上游静默升级；
        #    实测 `ci.yml` 的 `ios-build` 曾因上游换成 `actions/cache@v5`（Node 24）
        #    导致缓存解压 `spawn EIO`。详见 `ci.yml` 里 `cache: false` 的注释。
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          # 🔴 与 `ci.yml` 钉同一个版本号 —— 两处不一致会让「CI 绿 / 出包红」成为常态。
          flutter-version: 3.41.1

          # 🔴 `cache: false`（与 `ci.yml` 的 `ios-build` 一致）——
          #    本 job 同样跑在 **macOS**，而 `spawn EIO` 正是 macOS 的
          #    `/opt/homebrew/bin/gtar` 解压缓存时崩的。
          #    ⚠️ 代价：每次重下 ~2 GB Flutter SDK。但本 workflow 是
          #    **workflow_dispatch（手动）触发** ⇒ 频率极低，代价可接受。
          #    📌 判据：**手动触发的 job，稳定 > 快**。
          #
          # ⏳ 将来若确认 upstream 修好了 EIO（例如 actions/cache 出了修复版），
          #    可以把这里改回 `cache: true` —— 届时应先确认 `ci.yml` 的
          #    `ios-build` 也能带着缓存跑绿（**以那边为准，两边保持一致**）。
          cache: false

      - name: Install dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          # 🔴 2026-10-07 修正：本仓库 `app/ios/` 下**实际没有 Podfile**
          #    （`app/ios/.gitignore` 也没忽略它 ⇒ 是真缺失，不是被 ignore）。
          #
          #    🔑 判据来源：`ci.yml` 的 `ios-build`（**已验证可过**）**根本不跑 pod install** ——
          #       `flutter build ios` 自己会生成 Podfile 并完成 pod 集成。
          #       而这里硬跑 `pod install`，在无 Podfile 时必然
          #       `[!] No Podfile found in the project directory.` 直接失败。
          #
          #    ⇒ 改成**有则跑、无则跳过**：不假设 Podfile 一定存在，
          #       也不阻碍将来若真提交了 Podfile 的正常流程。
          if [ -f Podfile ]; then
            echo "✅ 发现 Podfile ⇒ pod install"
            pod install --repo-update
          else
            echo "⚠️ app/ios 下无 Podfile ⇒ 跳过（下一步 flutter build ios 会自动生成并处理）"
          fi
        working-directory: app/ios

      # ── 配置签名：API Key 落盘 + 注入 Team ID ────────────────────────────
      #
      # 🔴 修正 ①（相对参考实现）：**export-options.plist 的 teamID 用真值覆盖**
      #    参考实现里 plist 的 teamID 是 `YOUR_TEAM_ID` 占位符，且**没人替换它** ——
      #    那样 exportArchive 会失败（或导出出不可用的包）。
      #    ⇒ 用 `/usr/libexec/PlistBuddy`（macOS 自带，专用于 plist）。
      #    📌 为什么不用 sed：**按字符串猜 plist 结构是脆的**（`<string>export</string>`
      #       这类模式会随文件演进悄悄匹配错行）。PlistBuddy 按 key 路径操作。
      - name: 配置签名（API Key + Team ID）
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          UPLOAD: ${{ inputs.upload }}
          METHOD: ${{ inputs.method }}
        run: |
          set -euo pipefail

          # ① 私钥落盘（xcodebuild 要求它在 ~/private_keys/AuthKey_<KEY_ID>.p8）
          #
          # 🔴 2026-10-07：`printf '%s'` → **`'%s\n'`**
          #    `.p8` 是 PEM 格式，**末尾必须有换行**。
          #    Secret 的值末尾**有没有换行取决于复制时选到哪** ——
          #    在 GitHub 网页上粘贴多行值时，很容易漏掉最后一行末尾的换行。
          #    ⇒ 缺尾换行时 xcodebuild 会报 key 无效，而错误信息指向
          #       「认证失败」，很难联想到是**换行**问题。
          #    加 `\n` 后：有换行 ⇒ 末尾多一个空行（PEM 解析器容忍）；
          #                无换行 ⇒ 补上。**两种情况都可用（幂等）**。
          mkdir -p ~/private_keys
          printf '%s\n' "$ASC_KEY_P8" > ~/private_keys/AuthKey_$ASC_KEY_ID.p8
          chmod 600 ~/private_keys/AuthKey_$ASC_KEY_ID.p8

          # ② 往 plist 注入 Team ID
          PLIST=.github/export-options.plist
          /usr/libexec/PlistBuddy -c "Set :teamID $APPLE_TEAM_ID" "$PLIST"

          # ③ 🔴 修正 ②：**destination 按 input 切换**
          #    参考实现有个**静默陷阱**：plist 里写的是 `destination: export`
          #    （只导出、不上传），而注释却说「destination=upload 时会直接上传」
          #    ⇒ 勾了「上传」也**不会真的上传**，而日志看起来一切正常。
          #    📌 这正是本项目那条判据的又一实例：**「配置与意图矛盾」必须显式消除**。
          #
          # 🆕 2026-10-07：**method 也按 input 切换**（此前硬编码 app-store）
          #    动机：白哥要「先出包在 iPhone 真机上验证」，而 **app-store 分发的 IPA
          #    「装不了真机」**（只能上传 ASC → TestFlight）。
          #    真机直装需要 `ad-hoc` / `development`（前提：设备 UDID 已在开发者账号里注册）。
          #    ⚠️ 默认仍是 `app-store` ⇒ **向后兼容**，上架流程不受影响。
          #    🔴 `upload` 只对 app-store 有意义 —— ad-hoc/development **不能上传 ASC**。
          /usr/libexec/PlistBuddy -c "Set :method $METHOD" "$PLIST"

          if [ "$METHOD" != "app-store" ] && [ "$UPLOAD" = "true" ]; then
            echo "🔴 method=$METHOD 不支持上传 App Store Connect ⇒ 强制 destination=export"
            UPLOAD=false
          fi

          if [ "$UPLOAD" = "true" ]; then
            /usr/libexec/PlistBuddy -c "Set :destination upload" "$PLIST"
            echo "📤 destination=upload（会直接上传到 App Store Connect）"
          else
            /usr/libexec/PlistBuddy -c "Set :destination export" "$PLIST"
            echo "📦 destination=export（只产出 IPA，不上传）"
          fi

          echo "--- 最终 export options ---"
          cat "$PLIST"

      # ── 构建 ────────────────────────────────────────────────────────────
      #
      # 🔴 修正 ③（相对参考实现）：`flutter build ios --release` → 加 `--no-codesign`
      #    参考实现用的是**带签名**的 `flutter build ios --release`，
      #    但 `DEVELOPMENT_TEAM` 在 `ios/Runner.xcodeproj` 里**根本不存在**（实测 grep 0 命中）
      #    ⇒ 这一步会在「Select a Development Team」处失败。
      #    ⇒ 拆成：本步只**生成 Flutter 产物**（不签名），签名交给下一步的 xcodebuild。
      #
      # 🔴 修正 ④：**补 `--dart-define`**
      #    参考实现完全没传 ⇒ 产物会连 `localhost`（`api_config.dart` 的默认值）。
      #    `flutter build ios` 会把 dart-define 写进 `ios/Flutter/Generated.xcconfig`，
      #    下一步 xcodebuild 会读到它 ⇒ **只需在这里传一次**。
      #    📌 判据：**「构建成功」≠「包可用」** —— 缺 dart-define 不报错，
      #       只在运行时表现为「网络请求全失败」，极易误判成「App 坏了」。
      - name: Build Flutter artifacts (no codesign)
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=API_HOST=api.keyievolution.fun \
            --dart-define=PUBLIC_BASE_URL=https://keyievolution.fun

      # ── 归档（这一步才签名）────────────────────────────────────────────
      #
      # 🔴 修正 ⑤：**必须显式传 `DEVELOPMENT_TEAM`**
      #    `flutter build ipa` **不暴露 Team ID 参数**（实测读 `flutter_tools` 源码：
      #    `BuildIOSArchiveCommand` 只有 `--export-method` / `--export-options-plist`），
      #    而自动签名若拿不到 Team 会去**交互式询问**（CI 无终端 ⇒ 卡死或失败）。
      #    ⇒ 用 xcodebuild 的**命令行 build setting 覆盖**（标准做法，**不需改 pbxproj**）。
      #    📌 为什么不在 `project.pbxproj` 里写死：那样 Team ID 会进 git，
      #       且改 pbxproj 格式风险高（它由 Xcode 维护）。
      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # 🔴🔴 2026-10-11：**明确用 Distribution 签名归档**（此前用模板默认的 Development）。
          #
          # # 为什么必须覆盖（真机踩到的出包阻塞）
          #
          # `app/ios/Runner.xcodeproj/project.pbxproj` 里是 Flutter 模板的默认值：
          #     "CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "iPhone Developer";
          # ⇒ archive 阶段用 **Development 签名** ⇒ Xcode 去找 `iOS App Development` profile。
          # 而本步骤开着 `-allowProvisioningUpdates`（自动管理）⇒ 每次归档都可能
          # **新增一张 Development 证书** ⇒ 证书**只增不减** ⇒ 攒到 Apple 账号上限后：
          #     error: Your account has reached the maximum number of certificates.
          #     error: No profiles for 'com.coevo.coevoApp' were found
          # ⇒ **出包直接失败**（2026-10-11 12:11 run 38110797295 就是这样挂的）。
          #
          # 🔑 而 **Release 归档本来就该用 Distribution 签名** —— 用 Development 是模板遗留。
          #    改到 Distribution 后：**不再消耗 Development 证书** ⇒ 不再堆积。
          #    且 Distribution 证书/profile 是**每个 bundle id 一套、长期复用**，不会每次新建。
          #
          # ⚠️ 两条都传：pbxproj 里的键带 `[sdk=iphoneos*]` **条件**，
          #    只覆盖无条件键在部分 Xcode 版本下可能不彻底 ⇒ 带条件的那条一并覆盖。
          #    📌 命令行 build setting 优先级最高（覆盖 pbxproj），引号保住 `[` 不被 shell 解释。
          #
          # ⚠️ 为什么**不**直接改 `pbxproj`（那样更"干净"）：它由 Xcode/Flutter 维护，
          #    改它的格式风险高（见本步骤上方原有的那条注释）；且**本机调试仍该用 Development**
          #    ⇒ 只在 CI 的归档命令上覆盖，是本机与 CI 各取所需的做法。
          # 📄 排查记录：`docs/review/ios-archive-failed-cert-limit-2026-10-11.md`
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/ios/archive/Runner.xcarchive \
            -sdk iphoneos \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_$ASC_KEY_ID.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            "CODE_SIGN_IDENTITY[sdk=iphoneos*]"="Apple Distribution" \
            archive

      # ── 导出（上传与否由 plist 的 destination 决定）─────────────────────
      - name: Export IPA（upload 时同时上传 ASC）
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist .github/export-options.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_$ASC_KEY_ID.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: 校验 IPA 产物（缺失即失败）
        # 🔴 2026-10-07：原来的「列出产物」是 `ls ... || true`，不构成校验 ——
        #    `exportArchive` 返回 0 **不代表**真产出了 .ipa（历史上它就"成功"过
        #    但没有任何产物）。⇒ 显式断言「文件存在 + 大小合理」。
        #    📌 判据：**「绿」≠「有产物」** —— 校验要断言**产物**，不是断言**命令退出码**。
        run: |
          set -euo pipefail
          echo "--- build/ios/ipa 目录 ---"
          ls -la build/ios/ipa/ || true
          ipa=$(ls build/ios/ipa/*.ipa 2>/dev/null | head -1)
          if [ -z "$ipa" ]; then
            echo "🔴 未产出任何 .ipa —— exportArchive 虽返回 0，但产物不存在"
            exit 1
          fi
          size=$(stat -f%z "$ipa")
          echo "✅ IPA: $ipa  ($((size / 1024 / 1024)) MB)"
          if [ "$size" -lt 1000000 ]; then
            echo "🔴 IPA 小于 1 MB（$size 字节）—— 疑似异常产物"
            exit 1
          fi

      - name: Upload IPA as artifact
        uses: actions/upload-artifact@v6
        with:
          name: coevo-ios-ipa
          # ⚠️ 这里的路径**相对仓库根**（upload-artifact 不受 defaults.run.working-directory 影响）
          path: app/build/ios/ipa/*.ipa
          # 🔴 2026-10-07：`warn` → **`error`**。`warn` 会让「一个文件都没有」
          #    也判为成功 ⇒ 典型的**假绿**（job 绿、却没有包可下）。
          if-no-files-found: error
          retention-days: 7

      # ── 收尾：清掉 runner 上的私钥 ────────────────────────────────────────
      #
      # 🔑 runner 是一次性的，但**显式删除**是廉价的好习惯
      #    （万一 runner 被复用，或有人 dump 了工作区）。
      #    用 `if: always()` ⇒ 前面失败时也要清。
      - name: 清理私钥
        if: always()
        run: rm -rf ~/private_keys
