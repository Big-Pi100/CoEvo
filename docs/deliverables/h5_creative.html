<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>每天进化1% · CoEvo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, 'PingFang SC', 'Helvetica Neue', 'Noto Sans CJK SC', system-ui, sans-serif;
            background: #0b0f1a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 16px 30px;
            background-image:
                radial-gradient(ellipse at 20% 10%, rgba(255, 180, 60, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 90%, rgba(0, 220, 180, 0.07) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 50%, rgba(120, 80, 255, 0.03) 0%, transparent 70%);
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: linear-gradient(165deg, rgba(22, 28, 46, 0.92) 0%, rgba(14, 18, 34, 0.96) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 48px 48px 40px 40px;
            padding: 28px 24px 24px;
            box-shadow:
                0 30px 60px -20px rgba(0, 0, 0, 0.8),
                inset 0 1px 0 rgba(255, 255, 255, 0.06),
                0 0 0 1px rgba(255, 255, 255, 0.04);
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        /* 装饰光晕 */
        .card::before {
            content: '';
            position: absolute;
            top: -120px;
            right: -80px;
            width: 280px;
            height: 280px;
            background: radial-gradient(circle, rgba(255, 180, 60, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        .card::after {
            content: '';
            position: absolute;
            bottom: -60px;
            left: -40px;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(0, 220, 180, 0.10) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        /* 装饰小圆点 */
        .deco-dots {
            position: absolute;
            top: 40px;
            left: 20px;
            width: 60px;
            height: 60px;
            background-image: radial-gradient(circle, rgba(255, 255, 255, 0.08) 1.5px, transparent 1.5px);
            background-size: 12px 12px;
            pointer-events: none;
            z-index: 0;
            opacity: 0.5;
        }

        .content {
            position: relative;
            z-index: 1;
        }

        /* 头部：品牌 + 标题 */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
        }

        .brand {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.35);
            letter-spacing: 1.5px;
            font-weight: 400;
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(255, 255, 255, 0.04);
            padding: 4px 12px 4px 8px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .brand-icon {
            font-size: 18px;
            line-height: 1;
            color: rgba(255, 200, 100, 0.7);
        }

        .badge-live {
            font-size: 11px;
            background: linear-gradient(135deg, rgba(255, 180, 60, 0.25), rgba(255, 120, 80, 0.20));
            color: #ffc878;
            padding: 4px 12px;
            border-radius: 40px;
            border: 1px solid rgba(255, 180, 60, 0.15);
            letter-spacing: 0.5px;
            font-weight: 500;
            backdrop-filter: blur(4px);
            animation: pulse-badge 2.4s ease-in-out infinite;
        }

        @keyframes pulse-badge {
            0%,
            100% {
                opacity: 0.9;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.03);
            }
        }

        /* 标题区 */
        .title-section {
            text-align: center;
            margin-bottom: 28px;
        }

        .title-main {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #fde68a 0%, #f59e0b 40%, #f97316 80%, #f59e0b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 0.5px;
            line-height: 1.2;
            margin-bottom: 4px;
            text-shadow: 0 0 40px rgba(245, 158, 11, 0.15);
        }

        .title-sub {
            font-size: 15px;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 400;
            letter-spacing: 4px;
            margin-top: 2px;
        }

        .divider-glow {
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(245, 158, 11, 0.4), transparent);
            margin: 10px auto 0;
            border-radius: 4px;
        }

        /* 用户头像 / 昵称 */
        .user-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 28px;
            background: rgba(255, 255, 255, 0.03);
            padding: 10px 20px;
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(4px);
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f59e0b, #f97316);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 600;
            color: #0b0f1a;
            flex-shrink: 0;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.2);
        }

        .user-name {
            font-size: 17px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            letter-spacing: 0.3px;
            max-width: 160px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .user-name .highlight {
            color: #fde68a;
        }

        /* 数据卡片网格 */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 28px;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 20px;
            padding: 16px 8px 14px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(4px);
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
        }

        .stat-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            border-radius: 20px 20px 0 0;
            opacity: 0.6;
        }

        .stat-item:nth-child(1)::before {
            background: linear-gradient(90deg, #f59e0b, #f97316);
        }
        .stat-item:nth-child(2)::before {
            background: linear-gradient(90deg, #10b981, #06b6d4);
        }
        .stat-item:nth-child(3)::before {
            background: linear-gradient(90deg, #8b5cf6, #ec4899);
        }

        .stat-item:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.10);
        }

        .stat-number {
            font-size: 28px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.1;
            letter-spacing: -0.5px;
            display: block;
        }

        .stat-item:nth-child(1) .stat-number {
            background: linear-gradient(135deg, #fde68a, #f97316);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-item:nth-child(2) .stat-number {
            background: linear-gradient(135deg, #6ee7b7, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-item:nth-child(3) .stat-number {
            background: linear-gradient(135deg, #c084fc, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.45);
            margin-top: 4px;
            letter-spacing: 0.5px;
            font-weight: 400;
        }

        .stat-icon {
            font-size: 18px;
            display: block;
            margin-bottom: 4px;
            opacity: 0.7;
        }

        /* 进化进度条 */
        .progress-section {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 24px;
            padding: 18px 20px 20px;
            margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(4px);
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 8px;
            letter-spacing: 0.3px;
        }

        .progress-header strong {
            color: rgba(255, 255, 255, 0.8);
            font-weight: 600;
        }

        .progress-bar-track {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #f59e0b, #f97316, #ec4899, #8b5cf6);
            border-radius: 20px;
            animation: fillProgress 1.6s ease-out forwards;
            box-shadow: 0 0 16px rgba(245, 158, 11, 0.2);
        }

        @keyframes fillProgress {
            0% {
                width: 0%;
                opacity: 0.6;
            }
            100% {
                width: 67%;
                opacity: 1;
            }
        }

        .progress-hint {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.25);
            margin-top: 6px;
            letter-spacing: 0.3px;
        }

        .progress-hint span:last-child {
            color: rgba(255, 200, 100, 0.4);
        }

        /* 推广码区域 */
        .referral-section {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.06), rgba(139, 92, 246, 0.06));
            border-radius: 24px;
            padding: 18px 20px 20px;
            margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(4px);
            position: relative;
            overflow: hidden;
        }

        .referral-section::before {
            content: '';
            position: absolute;
            top: -30px;
            right: -30px;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, rgba(245, 158, 11, 0.08), transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .referral-label {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.45);
            letter-spacing: 1px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .referral-label span {
            background: rgba(255, 255, 255, 0.05);
            padding: 2px 10px;
            border-radius: 40px;
            font-size: 11px;
            color: #fde68a;
            border: 1px solid rgba(245, 158, 11, 0.15);
        }

        .referral-code-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.30);
            border-radius: 16px;
            padding: 12px 18px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(4px);
        }

        .referral-code {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 4px;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(245, 158, 11, 0.08);
            font-family: 'SF Mono', 'Menlo', monospace;
        }

        .referral-code-hint {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.04);
            padding: 4px 12px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .referral-code-hint::before {
            content: '⏤';
            opacity: 0.4;
        }

        /* 分享按钮 */
        .
