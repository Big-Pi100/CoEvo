[package]
name = "api_server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
chat_engine = { path = "../chat_engine" }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
# 合规词表里的多词词条（`\b` + `\s+`）用 regex；⚠️ 单词词条用手写词边界
# （regex crate 不支持 lookaround，见 compliance.rs::find_bounded）
regex = "1"
rsa = "0.9"
aes-gcm = "0.10"
rand = "0.8"
tokio.workspace = true
axum.workspace = true
tracing.workspace = true
rusqlite.workspace = true
r2d2.workspace = true
r2d2_sqlite.workspace = true
tower-http.workspace = true
reqwest.workspace = true
base64 = "0.22"
resvg = "0.43"
md5 = "0.7"
sha2 = { version = "0.10", features = ["oid"] }
bcrypt = "0.15"
thiserror.workspace = true
hex.workspace = true
hmac = "0.12"
sha1 = "0.10"
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
futures-util.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
qrcode = "0.14"
encoding_rs = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
# ── 内容源抓取（2026-09-29 · 白哥定「先做后端」）──────────────────
# `roxmltree`：只读 XML 树解析 —— 解析 RSS 2.0 足够。
# 🔴 为什么不用 `feed-rs` / `scraper`（实测约束，非偏好）：
#   ① 本机 `cargo check` **卡在「Updating crates.io index」超时**（代理拉全量索引很慢）；
#   ② `roxmltree 0.20.0` **已在 Cargo.lock + 本地 crate 缓存里** → `--offline` 可构建；
#   ③ 实测 4 个可达源（NPR / ECNS / Ars Technica / Dev.to）**全是 RSS 2.0**
#      （root 都是 `<rss>`，无 Atom）→ 不需要 feed-rs 的多格式能力。
#   📌 若将来要接 Atom / JSON Feed，再引 `feed-rs`（构建环境允许时）。
# HTML→纯文本用已依赖的 `regex`（本项目的 `compliance.rs` 已是这个路子）。
roxmltree = "0.20"
# HTML 解析（抓文章正文用）—— RSS 通常只给摘要，全文要抓原网页
scraper = "0.20"

[dev-dependencies]
dotenvy = "0.15"
student_llm = { path = "../student_llm" }
futures-util.workspace = true
