[package]
name = "api_server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
chat_engine = { path = "../chat_engine" }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
# 合规词表里的多词词条（`\b` + `\s+`）用 regex；⚠️ 单词词条用手写词边界
# （regex crate 不支持 lookaround，见 compliance.rs::find_bounded）
regex = "1"
rsa = "0.9"
aes-gcm = "0.10"
rand = "0.8"
tokio.workspace = true
axum.workspace = true
tracing.workspace = true
rusqlite.workspace = true
r2d2.workspace = true
r2d2_sqlite.workspace = true
tower-http.workspace = true
reqwest.workspace = true
base64 = "0.22"
resvg = "0.43"
md5 = "0.7"
sha2 = { version = "0.10", features = ["oid"] }
bcrypt = "0.15"
thiserror.workspace = true
hex.workspace = true
hmac = "0.12"
sha1 = "0.10"
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
futures-util.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
qrcode = "0.14"
encoding_rs = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
# ── 内容源抓取（2026-09-29 · 白哥定「先做后端」）──────────────────
# `roxmltree`：只读 XML 树解析 —— 解析 RSS 2.0 足够。
# 🔴 为什么不用 `feed-rs` / `scraper`（实测约束，非偏好）：
#   ① 本机 `cargo check` **卡在「Updating crates.io index」超时**（代理拉全量索引很慢）；
#   ② `roxmltree 0.20.0` **已在 Cargo.lock + 本地 crate 缓存里** → `--offline` 可构建；
#   ③ 实测 4 个可达源（NPR / ECNS / Ars Technica / Dev.to）**全是 RSS 2.0**
#      （root 都是 `<rss>`，无 Atom）→ 不需要 feed-rs 的多格式能力。
#   📌 若将来要接 Atom / JSON Feed，再引 `feed-rs`（构建环境允许时）。
# HTML→纯文本用已依赖的 `regex`（本项目的 `compliance.rs` 已是这个路子）。
roxmltree = "0.20"
# HTML 解析（抓文章正文用）—— RSS 通常只给摘要，全文要抓原网页
scraper = "0.20"
# ── 正文提取升级（2026-10-02 · 白哥「用成熟包，不自建」）────────────
# `dom_smoothie` = **readability.js 的 Rust 移植**（Firefox 阅读模式同源算法）。
# 🔴 为什么换掉自建的 `content_extract` 启发式（不是偏好，是实测）：
#   ① 自建版**只取 `<p>` 的纯文本** → 丢掉「哪里是代码/图/表格」的结构：
#      · `<pre>` 里的 ASCII 树被 `collapse_ws` 压成一行（用户看到的是乱码）
#      · 讨论 HTML 标签的文章里，`<code>` 内容裸奔（看着像源码泄漏）
#   ② 内建 `TextMode::Markdown` → **一步到位产出 Markdown**（围栏代码块保留换行缩进）
#   ③ 实测两个症状都治好，见 `docs/review/content-pipeline-rebuild-plan-2026-10-02.md` §十一
# 🔑 选它的硬理由：**与项目现有 `scraper 0.20` 共享同一个 `html5ever 0.27.0`**
#    → 零重复编译、二进制不膨胀（对照：`htmd` 用 html5ever 0.39 → 会引入第二份解析器）。
#    📌 判据：选包不只看「能不能做」，还要看「**与现有栈叠不叠**」。
dom_smoothie = "0.18"
# ── Apple IAP 服务端验证（2026-10-04）──────────────────────────
# ES256（ECDSA P-256）签 App Store Server API 的鉴权 JWT。
#
# 🔑 为什么用 `ring` 而不是 `jsonwebtoken` / `p256`（**实测约束，非偏好**）：
#    `ring 0.17.14` **已在 Cargo.lock + 本地 crate 缓存**（reqwest 的间接依赖）
#    ⇒ 显式声明为直接依赖**不会触发拉取 crates.io 索引** ⇒ `--offline` 可构建。
#    而 `jsonwebtoken` / `p256` 都不在 Cargo.lock ⇒ 按本机实测的索引超时问题，
#    贸然引入会导致 `cargo check` 卡死。（同族判据见上方 roxmltree 的说明。）
#
# ⚠️ 用它签 JWT 有两个必须踩对的点（已写进 `iap_handlers::sign_es256` 的注释）：
#    ① `.p8` 是 PEM，`EcdsaKeyPair::from_pkcs8` 收 **DER** ⇒ 必须先剥头尾再解码
#    ② 必须用 `ECDSA_P256_SHA256_FIXED_SIGNING`（R||S 64 字节），
#       不能用 `_ASN1_`（DER 编码）—— 后者不符合 JWT ES256 规范，Apple 会 401
ring = "0.17"

[dev-dependencies]
dotenvy = "0.15"
student_llm = { path = "../student_llm" }
futures-util.workspace = true
