# CoEvo 成就定义文件 — 数据驱动成就系统 (Phase 4)
# 版本: V3.0 | 日期: 2026-06-06
# 扩展方式: 新成就 = 编辑此文件 + 部署, 不改代码、不重新编译
#
# 双语格式:
#   name = {zh = "中文名", en = "English Name"}
#   description = {zh = "中文描述", en = "English description"}
# 单语格式（向后兼容）:
#   name = "中文名"   → 自动解析为 {zh: "中文名", en: ""}
#
# 条件语法:
#   conditions = [{ metric, op, value }]     # 单个条件 (AND 连接)
#   conditions = [...] + condition_logic = "AND" | "OR"
#   op 支持: gte, lte, eq, gt, lt
#
# 触发点 (triggers):
#   review_completed — 复习提交后
#   card_created — 卡片创建后（WS 概念提取/知识图谱生成）
#   conversation_ended — 对话结束（WS 断开时）
#   plan_completed — 学习计划任务完成
#   daily_tick — 每日定时检查（24h 冷却，高频路径入口）
#
# 隐藏成就: hidden = true  → 解锁后前端标注"隐藏成就"

# ─────────────────────────────────────────────────────────────────────
# 🌱 启程 (seed) — 首次行为里程碑
# ─────────────────────────────────────────────────────────────────────

[achievements.first_card]
category = "seed"
tier = "bronze"
name = {zh = "初识", en = "First Step"}
description = {zh = "创建第一张卡片", en = "Create your first card"}
icon = "auto_stories"
color = "#CD7F32"
conditions = [{ metric = "total_cards", op = "gte", value = 1 }]
triggers = ["card_created"]

[achievements.first_review]
category = "seed"
tier = "bronze"
name = {zh = "首测", en = "First Review"}
