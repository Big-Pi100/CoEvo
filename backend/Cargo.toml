[workspace]
resolver = "2"
members = [
    "crates/shared_types",
    "crates/api_server",
    "crates/chat_engine",
    "crates/card_engine",
    "crates/growth_engine",
    "crates/student_llm",
]

[package]
name = "coevo_backend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
default-run = "coevo_backend"

[[bin]]
name = "e2e-pipeline-test"
path = "src/bin/e2e_pipeline_test.rs"

[dependencies]
api_server = { path = "crates/api_server" }
chat_engine = { path = "crates/chat_engine" }
chrono.workspace = true
card_engine = { path = "crates/card_engine" }
shared_types = { path = "crates/shared_types" }
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
dotenvy.workspace = true
axum.workspace = true
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
rusqlite = { workspace = true, features = ["bundled"] }
toml = "0.8"
serde.workspace = true
uuid.workspace = true

[workspace.package]
edition = "2021"
rust-version = "1.75"
version = "0.2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
axum = { version = "0.8", features = ["ws", "multipart"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
futures-core = { version = "0.3", default-features = false }
dotenvy = "0.15"
futures-util = "0.3"
r2d2 = "0.8"
r2d2_sqlite = "0.25"
strsim = "0.11"
sha2 = "0.10"
hex = "0.4"
aes-gcm = "0.10"
rand = "0.8"
